<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep-Live-Cam UI</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --line: #2a2f3d;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #7c5cff; --ok: #2ecc71; --bad: #ff5c7a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px;
  }
  .app { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: 1fr 300px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 20px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); transition: .3s; }
  .dot.on { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .preview {
    position: relative; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden;
    background: repeating-linear-gradient(45deg, #151821 0 12px, #12151d 12px 24px);
    display: grid; place-items: center; color: var(--muted);
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .fps { position: absolute; top: 10px; left: 10px; font: 12px monospace; background: #000a; padding: 3px 7px; border-radius: 6px; }
  .faces { display: flex; gap: 12px; margin-top: 16px; }
  .drop {
    flex: 1; border: 2px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center;
    cursor: pointer; font-size: 13px; color: var(--muted); transition: .2s; position: relative; min-height: 110px;
    display: grid; place-items: center; overflow: hidden;
  }
  .drop:hover { border-color: var(--accent); color: var(--text); }
  .drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .drop input { display: none; }
  h2 { font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-of-type { border: 0; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--line); border-radius: 22px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .btns { display: grid; gap: 10px; margin-top: 16px; }
  button {
    border: 0; border-radius: 10px; padding: 12px; font-weight: 600; font-size: 14px; cursor: pointer;
    background: var(--accent); color: #fff; transition: transform .1s, filter .2s;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(.98); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .log { font: 12px monospace; color: var(--muted); max-height: 90px; overflow: auto; margin-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Deep<span>Live</span>Cam</h1>
    <div class="status"><div class="dot" id="dot"></div><span id="statusText">Остановлено</span></div>
  </header>

  <section class="card">
    <div class="preview" id="preview">
      <span id="placeholder">Нажмите «Запустить камеру»</span>
      <video id="video" autoplay playsinline muted></video>
      <div class="fps" id="fps" hidden>0 FPS</div>
    </div>
    <div class="faces">
      <label class="drop">
        <input type="file" accept="image/*" data-target="src">
        <span>Исходное лицо<br><small>нажмите, чтобы выбрать</small></span>
      </label>
      <label class="drop">
        <input type="file" accept="image/*,video/*" data-target="dst">
        <span>Цель<br><small>фото или видео</small></span>
      </label>
    </div>
  </section>

  <aside class="card">
    <h2>Настройки</h2>
    <div class="row">Сохранять FPS <label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="row">Улучшение лица <label class="switch"><input type="checkbox" id="enhance"><span class="slider"></span></label></div>
    <div class="row">Зеркало <label class="switch"><input type="checkbox" id="mirror"><span class="slider"></span></label></div>
    <div class="row">Много лиц <label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="row">Движок
      <select><option>CPU</option><option>CUDA</option><option>CoreML</option><option>DirectML</option></select>
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <span>Прозрачность маски: <b id="opVal">80%</b></span>
      <input type="range" id="opacity" min="0" max="100" value="80">
    </div>
    <div class="btns">
      <button id="camBtn">▶ Запустить камеру</button>
      <button class="ghost" id="shotBtn">📸 Снимок</button>
    </div>
    <div class="log" id="log"></div>
  </aside>
</div>

<script>
  const $ = id => document.getElementById(id);
  const video = $('video'), log = $('log');
  let stream = null, frames = 0, last = performance.now();

  const say = msg => {
    log.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + log.innerHTML;
  };

  const setStatus = on => {
    $('dot').classList.toggle('on', on);
    $('statusText').textContent = on ? 'В эфире' : 'Остановлено';
    $('camBtn').textContent = on ? '■ Остановить' : '▶ Запустить камеру';
    $('fps').hidden = !on;
    $('placeholder').style.display = on ? 'none' : '';
    video.style.display = on ? 'block' : 'none';
  };

  $('camBtn').onclick = async () => {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null; setStatus(false); say('Камера остановлена');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream; setStatus(true); say('Камера запущена');
    } catch (e) {
      say('Нет доступа к камере: ' + e.name);
    }
  };

  // Счётчик FPS
  (function tick(now) {
    if (stream) {
      frames++;
      if (now - last >= 1000) { $('fps').textContent = frames + ' FPS'; frames = 0; last = now; }
    }
    requestAnimationFrame(tick);
  })(performance.now());

  $('mirror').onchange = e => video.style.transform = e.target.checked ? 'scaleX(-1)' : '';
  $('enhance').onchange = e => {
    video.style.filter = e.target.checked ? 'contrast(1.1) saturate(1.2) brightness(1.05)' : '';
    say('Улучшение лица: ' + (e.target.checked ? 'вкл' : 'выкл'));
  };
  $('opacity').oninput = e => {
    $('opVal').textContent = e.target.value + '%';
    video.style.opacity = 0.4 + e.target.value / 166;
  };

  document.querySelectorAll('.drop input').forEach(inp => {
    inp.onchange = () => {
      const file = inp.files[0];
      if (!file || !file.type.startsWith('image')) return file && say('Выбран файл: ' + file.name);
      let img = inp.parentElement.querySelector('img') || inp.parentElement.appendChild(new Image());
      img.src = URL.createObjectURL(file);
      say('Загружено: ' + file.name);
    };
  });

  $('shotBtn').onclick = () => {
    if (!stream) return say('Сначала запустите камеру');
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png'); a.download = 'snapshot.png'; a.click();
    say('Снимок сохранён');
  };
</script>
</body>
</html>
